<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPM → ms</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #262628;
    --text: #e8e6e1;
    --muted: #8a8a8d;
    --accent: #5ec8b8;
    --border: #38383a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Courier New', ui-monospace, monospace;
    color: var(--text);
  }
  .card {
    width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 44px;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px 0;
    text-align: center;
  }
  .plan-meta {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
    min-height: 16px;
  }
  label {
    display: block;
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  select, input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 20px;
    font-family: inherit;
    padding: 14px 16px;
    text-align: center;
    appearance: none;
  }
  input[type="number"] {
    font-size: 32px;
    padding: 16px;
  }
  select:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field {
    margin-bottom: 22px;
  }
  .notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 28px 0;
  }
  .notes button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 18px;
    padding: 16px 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .notes button:hover {
    border-color: var(--accent);
  }
  .notes button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .result {
    text-align: center;
    margin-top: 14px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .result .value {
    font-size: 52px;
    color: var(--accent);
    font-weight: bold;
  }
  .result .unit {
    font-size: 15px;
    color: var(--muted);
    margin-top: 4px;
  }
  .no-bpm {
    color: #d98a5f;
  }
</style>
</head>
<body>

<div class="card">
  <h1>BPM → ms</h1>
  <div class="plan-meta" id="planMeta">loading plan…</div>

  <div class="field" id="songField" style="display:none;">
    <label for="song">Song (from next plan)</label>
    <select id="song"></select>
  </div>

  <div class="field">
    <label for="bpm">Tempo (BPM)</label>
    <input type="number" id="bpm" value="120" min="1">
  </div>

  <div class="notes" id="notes">
    <button data-n="16">1/16</button>
    <button data-n="8">1/8</button>
    <button data-n="6">1/6</button>
    <button data-n="4" class="active">1/4</button>
    <button data-n="2">1/2</button>
    <button data-n="1">1</button>
  </div>

  <div class="result">
    <div class="value" id="ms">500</div>
    <div class="unit">milliseconds</div>
  </div>
</div>

<script>
  const bpmInput = document.getElementById('bpm');
  const notesEl = document.getElementById('notes');
  const msEl = document.getElementById('ms');
  const songField = document.getElementById('songField');
  const songSelect = document.getElementById('song');
  const planMeta = document.getElementById('planMeta');
  let n = 4;

  function calc() {
    const bpm = parseFloat(bpmInput.value) || 0;
    if (bpm <= 0) {
      msEl.textContent = '—';
      return;
    }
    const ms = (60000 / bpm) * (4 / n);
    msEl.textContent = ms % 1 === 0 ? ms.toString() : ms.toFixed(1);
  }

  bpmInput.addEventListener('input', calc);

  notesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    notesEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    n = parseFloat(btn.dataset.n);
    calc();
  });

  // --- Planning Center sync ---
  async function loadPlan() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data.json yet');
      const data = await res.json();

      if (!data.songs || data.songs.length === 0) {
        planMeta.textContent = data.planTitle
          ? `${data.planTitle} — no songs found`
          : 'no upcoming plan found';
        return;
      }

      planMeta.textContent = `${data.planTitle || 'Next plan'} · synced ${new Date(data.updated).toLocaleDateString()}`;
      songField.style.display = 'block';

      songSelect.innerHTML = '<option value="">— pick a song —</option>' +
        data.songs.map((s, i) =>
          `<option value="${i}">${s.title}${s.bpm ? ` (${s.bpm} BPM)` : ' (no BPM set)'}</option>`
        ).join('');

      songSelect.addEventListener('change', () => {
        const idx = songSelect.value;
        if (idx === '') return;
        const song = data.songs[idx];
        if (song.bpm) {
          bpmInput.value = song.bpm;
          bpmInput.classList.remove('no-bpm');
        } else {
          bpmInput.classList.add('no-bpm');
        }
        calc();
      });
    } catch (err) {
      planMeta.textContent = 'no synced plan yet — enter BPM manually';
    }
  }

  loadPlan();
  calc();
</script>

</body>
</html>
