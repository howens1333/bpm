<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Plan Tools</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1e;
    --card: #202022;
    --card-hover: #2a2a2c;
    --text: #f2f2f2;
    --muted: #a0a0a3;
    --accent: #1ed760;
    --accent-dim: rgba(30, 215, 96, 0.15);
    --pad-accent: #b98af0;
    --pad-accent-dim: rgba(185, 138, 240, 0.15);
    --border: #2e2e30;
    --warn: #d98a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .col { border-right: none !important; border-bottom: 1px solid var(--border); }
    .col-left { position: static !important; max-height: none !important; }
  }
  .col {
    padding: 28px 22px 60px;
  }
  .col-left {
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  /* --- Song cards (left) --- */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .song-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .song-card:hover { background: var(--card-hover); }
  .song-card.active { border-color: var(--accent); background: var(--card-hover); }
  .art {
    width: 52px;
    height: 52px;
    border-radius: 6px;
    background: linear-gradient(135deg, #3a3a3c, #232325);
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
  }
  .song-info { flex: 1; min-width: 0; }
  .song-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-sub {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .song-sub .no-bpm { color: var(--warn); }
  .song-ms { text-align: right; flex-shrink: 0; padding-left: 10px; }
  .song-ms .val {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .song-ms .unit {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* --- Manual calculator (left) --- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px 0;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 26px;
    font-family: inherit;
    padding: 14px 16px;
    text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 20px; }
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
  }
  .notes-grid button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 14px 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .notes-grid button:hover { border-color: var(--accent); }
  .notes-grid button.active {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 700;
  }
  .result {
    text-align: center;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .result .value { font-size: 40px; color: var(--accent); font-weight: 700; }
  .result .unit { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* --- Plan items / notes (right) --- */
  .items {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  /* Header rows — full-width section dividers, like PCO's gray bars */
  .row-header-bar {
    padding: 12px 18px;
    background: #232326;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row-header-bar:hover { color: var(--text); }

  /* Regular rows — songs and plain items, table-like */
  .item-row {
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .row-main {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .row-main:hover { background: var(--card-hover); }
  .item-row.is-song .row-main { border-left-color: var(--accent); }

  .row-text { flex: 1; min-width: 0; }
  .row-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-row.is-song .row-title { color: var(--accent); }
  .row-sub {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .row-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .row-tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: var(--accent);
    color: #0a0a0a;
    padding: 5px 11px;
    border-radius: 20px;
  }
  .row-tag.tag-pad {
    background: var(--pad-accent);
    color: #0a0a0a;
  }
  .row-chevron {
    color: var(--muted);
    font-size: 12px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .item-row.open .row-chevron,
  .row-header-bar.open .row-chevron { transform: rotate(90deg); }

  .row-options {
    display: none;
    padding: 4px 18px 18px;
    background: var(--bg);
  }
  .item-row.open .row-options { display: block; }
  .option-group-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 8px;
  }
  .option-group-label:first-child { margin-top: 12px; }
  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .option-chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
  }
  .option-chip:active { transform: scale(0.97); }
  .option-chip.selected {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
  }
  .option-chip.pad-chip.selected {
    background: var(--pad-accent);
    border-color: var(--pad-accent);
  }
  .empty-state { font-size: 13px; color: var(--muted); padding: 16px 18px; }

  /* --- Unified top nav --- */
  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 20px 22px 0;
    padding: 16px 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    position: sticky;
    top: 14px;
    z-index: 20;
  }
  .topnav-left { min-width: 0; flex: 1 1 auto; }
  .plan-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topnav-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .sync-info { text-align: right; line-height: 1.3; }
  .sync-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sync-value {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .refresh-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .refresh-btn:hover { border-color: var(--accent); background: var(--card-hover); color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.55; cursor: default; }
  .refresh-btn:disabled:hover { border-color: var(--border); background: var(--card); color: var(--text); }
  .refresh-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    transition: transform 0.6s linear;
  }
  .refresh-icon svg { width: 100%; height: 100%; display: block; }
  .refresh-btn.spinning .refresh-icon { animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .topnav-status {
    font-size: 12px;
    color: var(--muted);
    margin: 10px 22px 0;
  }
  .topnav-status:empty { display: none; }
  .topnav-status.err { color: var(--warn); }
  .topnav-status.ok { color: var(--accent); }

  /* --- Toasts --- */
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 340px;
  }
  .toast {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    animation: toast-in 0.2s ease;
  }
  .toast.ok { border-left-color: var(--accent); }
  .toast.err { border-left-color: var(--warn); }
  .toast-msg { flex: 1; line-height: 1.4; }
  .toast-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .toast-close:hover { color: var(--text); }
  .toast.leaving { animation: toast-out 0.15s ease forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }
  @media (max-width: 860px) {
    .toast-container { left: 14px; right: 14px; bottom: 14px; max-width: none; }
  }

  @media (max-width: 860px) {
    .topnav {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      margin: 14px 14px 0;
      padding: 14px 16px;
      top: 10px;
    }
    .plan-title {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-size: 16px;
      line-height: 1.3;
    }
    .topnav-right { width: 100%; justify-content: space-between; }
    .sync-info { text-align: left; }
    .topnav-status { margin: 8px 14px 0; }
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-left">
    <div class="plan-title" id="planTitle">Loading plan…</div>
  </div>
  <div class="topnav-right">
    <div class="sync-info">
      <span class="sync-label">Last Synced</span>
      <span class="sync-value" id="syncedAt">—</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="Pull the latest plan from Planning Center">
      <span class="refresh-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 11A8 8 0 1 0 18.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 5V11H14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="refreshBtnLabel">Refresh</span>
    </button>
  </div>
</div>
<div class="topnav-status" id="refreshStatus"></div>

<div class="toast-container" id="toastContainer"></div>

<div class="layout">

  <!-- LEFT: BPM tool -->
  <div class="col col-left">
    <div class="cards" id="cards"></div>

    <div class="panel">
      <h2>Manual</h2>
      <div class="field">
        <label for="bpm">Tempo (BPM)</label>
        <input type="number" id="bpm" value="120" min="1">
      </div>

      <div class="notes-grid" id="notesGrid">
        <button data-n="16">1/16</button>
        <button data-n="8">1/8</button>
        <button data-n="6">1/6</button>
        <button data-n="4" class="active">1/4</button>
        <button data-n="2">1/2</button>
        <button data-n="1">1</button>
      </div>

      <div class="result">
        <div class="value" id="ms">500</div>
        <div class="unit">milliseconds</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Plan items / assignment notes -->
  <div class="col col-right">
    <div class="items" id="items"></div>
  </div>

</div>

<script>
  // ---------- Shared state ----------
  const OPTIONS = ['HH1', 'HH2', 'HH3', 'HH4', 'WL', 'Mac', 'LAV 1', 'LAV 2', 'LAV 3', 'Meredith', 'Billy'];
  const PAD_OPTIONS = ['Pad C', 'Pad C#/Db', 'Pad D', 'Pad D#/Eb', 'Pad E', 'Pad F', 'Pad F#/Gb', 'Pad G', 'Pad G#/Ab', 'Pad A', 'Pad A#/Bb', 'Pad B'];
  let n = 4;
  let songs = [];
  let items = [];
  let planId = null;

  // ---------- GitHub Actions trigger (refresh button) ----------
  const GH_OWNER = 'howens1333';
  const GH_REPO = 'bpm';
  const GH_WORKFLOW_FILE = 'sync-plan.yml';
  // Paste your deployed Cloudflare Worker URL here once it's live, e.g.
  // 'https://bpm-refresh.yourname.workers.dev'
  const WORKER_URL = 'https://round-wind-1488.nathanielscotthowe.workers.dev/';

  // ---------- BPM calculator (left) ----------
  const bpmInput = document.getElementById('bpm');
  const notesGrid = document.getElementById('notesGrid');
  const msEl = document.getElementById('ms');
  const cardsEl = document.getElementById('cards');
  const planTitleEl = document.getElementById('planTitle');
  const syncedAtEl = document.getElementById('syncedAt');

  function msFor(bpm, noteN) {
    if (!bpm || bpm <= 0) return null;
    return (60000 / bpm) * (4 / noteN);
  }
  function fmt(ms) {
    if (ms === null) return '—';
    return ms % 1 === 0 ? ms.toString() : ms.toFixed(1);
  }
  function calc() {
    const bpm = parseFloat(bpmInput.value) || 0;
    msEl.textContent = fmt(msFor(bpm, n));
  }
  function renderCards() {
    if (!songs.length) { cardsEl.innerHTML = ''; return; }
    cardsEl.innerHTML = songs.map((s, i) => `
      <div class="song-card" data-i="${i}">
        ${s.art ? `<img class="art" src="${s.art}" alt="">` : `<div class="art">🎵</div>`}
        <div class="song-info">
          <div class="song-title">${s.title}</div>
          <div class="song-sub">${s.artist ? s.artist + ' · ' : ''}${s.bpm ? s.bpm + ' BPM' : '<span class="no-bpm">no BPM set</span>'}</div>
        </div>
        <div class="song-ms">
          <div class="val">${fmt(msFor(s.bpm, n))}</div>
          <div class="unit">ms</div>
        </div>
      </div>
    `).join('');
  }

  bpmInput.addEventListener('input', calc);

  notesGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    notesGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    n = parseFloat(btn.dataset.n);
    calc();
    renderCards();
  });

  cardsEl.addEventListener('click', (e) => {
    const cardEl = e.target.closest('.song-card');
    if (!cardEl) return;
    cardsEl.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
    cardEl.classList.add('active');
    const song = songs[cardEl.dataset.i];
    if (song.bpm) { bpmInput.value = song.bpm; calc(); }
  });

  async function enrichSong(song) {
    try {
      const q = encodeURIComponent(song.title);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
      const data = await res.json();
      const hit = data.results && data.results[0];
      if (hit) {
        song.artist = hit.artistName;
        song.art = hit.artworkUrl100 ? hit.artworkUrl100.replace('100x100bb', '300x300bb') : null;
      }
    } catch (err) { /* not on iTunes, skip */ }
  }

  // ---------- Plan item notes (right) ----------
  const itemsEl = document.getElementById('items');

  function storageKey(itemId) {
    return `pco-notes:${planId}:${itemId}`;
  }
  function getTags(itemId) {
    try {
      const raw = localStorage.getItem(storageKey(itemId));
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function setTags(itemId, tags) {
    localStorage.setItem(storageKey(itemId), JSON.stringify(tags));
  }

  function renderItems() {
    if (!items.length) {
      itemsEl.innerHTML = '<div class="empty-state">no plan items yet</div>';
      return;
    }
    itemsEl.innerHTML = items.map((it, idx) => {
      // Fallback to a positional id if the synced data is missing a real
      // one, so items never accidentally share a storage key.
      const itemId = (it.id !== undefined && it.id !== null && it.id !== '')
        ? String(it.id)
        : `idx-${idx}`;
      const tags = getTags(itemId);
      const isHeader = it.type === 'header';
      const isSong = it.type === 'song';

      const optionsHtml = `
        <div class="row-options">
          <div class="option-group-label">Mics / People</div>
          <div class="option-grid">
            ${OPTIONS.map(opt => `
              <button class="option-chip ${tags.includes(opt) ? 'selected' : ''}" data-opt="${opt}">${opt}</button>
            `).join('')}
          </div>
          <div class="option-group-label">Pads</div>
          <div class="option-grid">
            ${PAD_OPTIONS.map(opt => `
              <button class="option-chip pad-chip ${tags.includes(opt) ? 'selected' : ''}" data-opt="${opt}">${opt.replace('Pad ', '')}</button>
            `).join('')}
          </div>
        </div>
      `;

      if (isHeader) {
        return `
          <div class="item-row" data-id="${itemId}" data-kind="header">
            <div class="row-header-bar">
              <span>${it.title}</span>
              <span class="row-chevron">▶</span>
            </div>
            ${optionsHtml}
          </div>
        `;
      }

      const sub = isSong
        ? `${it.artist ? it.artist + ' · ' : ''}${it.bpm ? it.bpm + ' BPM' : 'no BPM set'}`
        : '';

      return `
        <div class="item-row ${isSong ? 'is-song' : ''}" data-id="${itemId}">
          <div class="row-main">
            <div class="row-text">
              <div class="row-title">${it.title}</div>
              ${sub ? `<div class="row-sub">${sub}</div>` : ''}
              <div class="row-tags">${tags.map(t => `<span class="row-tag ${t.startsWith('Pad ') ? 'tag-pad' : ''}">${t.replace('Pad ', '')}</span>`).join('')}</div>
            </div>
            <div class="row-chevron">▶</div>
          </div>
          ${optionsHtml}
        </div>
      `;
    }).join('');
  }

  itemsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.option-chip');
    const rowEl = e.target.closest('.item-row');
    if (!rowEl) return;
    const itemId = rowEl.dataset.id;

    if (chip) {
      e.stopPropagation();
      const opt = chip.dataset.opt;
      const tags = getTags(itemId);
      const idx = tags.indexOf(opt);
      if (idx >= 0) tags.splice(idx, 1); else tags.push(opt);
      setTags(itemId, tags);
      renderItems();
      const reopened = itemsEl.querySelector(`.item-row[data-id="${CSS.escape(itemId)}"]`);
      if (reopened) reopened.classList.add('open');
      return;
    }

    const toggleTarget = e.target.closest('.row-main') || e.target.closest('.row-header-bar');
    if (toggleTarget) {
      rowEl.classList.toggle('open');
    }
  });

  // ---------- Load synced plan data ----------
  async function loadPlan() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data.json yet');
      const data = await res.json();

      planId = data.planId || 'no-plan';
      planTitleEl.textContent = data.planTitle || 'No upcoming plan found';
      syncedAtEl.textContent = data.updated
        ? new Date(data.updated).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        : '—';

      songs = data.songs || [];
      items = data.items || data.songs || [];

      renderCards();
      renderItems();

      await Promise.all(songs.map(async (s) => { await enrichSong(s); renderCards(); }));
    } catch (err) {
      planTitleEl.textContent = 'No synced plan yet';
      syncedAtEl.textContent = '—';
      planId = 'no-plan';
    }
  }

  // ---------- Refresh button ----------
  const refreshBtn = document.getElementById('refreshBtn');
  const refreshBtnLabel = document.getElementById('refreshBtnLabel');
  const refreshStatus = document.getElementById('refreshStatus');

  function setStatus(msg, kind) {
    refreshStatus.textContent = msg;
    refreshStatus.className = 'topnav-status' + (kind ? ' ' + kind : '');
  }
  const toastContainer = document.getElementById('toastContainer');
  function showToast(message, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    const msgEl = document.createElement('div');
    msgEl.className = 'toast-msg';
    msgEl.textContent = message;
    const closeBtn = document.createElement('button');
    closeBtn.className = 'toast-close';
    closeBtn.setAttribute('aria-label', 'Dismiss');
    closeBtn.textContent = '×';
    el.appendChild(msgEl);
    el.appendChild(closeBtn);
    const remove = () => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 150);
    };
    closeBtn.addEventListener('click', remove);
    toastContainer.appendChild(el);
    setTimeout(remove, 6000);
  }
  function setBusy(busy, label) {
    refreshBtn.disabled = busy;
    refreshBtn.classList.toggle('spinning', busy);
    refreshBtnLabel.textContent = label || (busy ? 'Refreshing…' : 'Refresh');
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function dispatchWorkflow() {
    const res = await fetch(WORKER_URL, { method: 'POST' });
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`dispatch-failed:${res.status}:${body}`);
    }
  }

  // Public, unauthenticated reads — fine for a public repo at this low volume.
  async function findRunAfter(sinceMs) {
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=5&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`list-failed:${res.status}`);
    const data = await res.json();
    const runs = data.workflow_runs || [];
    return runs.find(r => new Date(r.created_at).getTime() >= sinceMs) || null;
  }

  async function pollRun(runId) {
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/runs/${runId}?_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`run-check-failed:${res.status}`);
    return res.json();
  }

  async function runRefresh() {
    if (!WORKER_URL || WORKER_URL.startsWith('REPLACE_WITH')) {
      showToast('Worker URL not configured yet — see setup instructions.', 'err');
      return;
    }

    setBusy(true, 'Starting…');
    setStatus('Triggering GitHub Actions…');

    const triggeredAt = Date.now() - 5000; // small buffer for clock skew

    try {
      await dispatchWorkflow();
    } catch (err) {
      setBusy(false);
      setStatus('');
      showToast('Failed to start: ' + err.message, 'err');
      return;
    }

    setBusy(true, 'Waiting for run…');
    let run = null;
    for (let i = 0; i < 16 && !run; i++) {
      await sleep(2000);
      try {
        run = await findRunAfter(triggeredAt);
      } catch (err) {
        setBusy(false);
        setStatus('');
        showToast('Could not check run status: ' + err.message, 'err');
        return;
      }
    }

    if (!run) {
      setBusy(false);
      setStatus('');
      showToast('Triggered, but could not confirm the run — check the GitHub Actions tab.', '');
      return;
    }

    setBusy(true, 'Syncing…');
    for (let i = 0; i < 40; i++) {
      let latest;
      try {
        latest = await pollRun(run.id);
      } catch (err) {
        setBusy(false);
        setStatus('');
        showToast('Could not check run status: ' + err.message, 'err');
        return;
      }
      if (latest.status === 'completed') {
        setBusy(false, 'Refresh');
        if (latest.conclusion === 'success') {
          setStatus('Synced — reloading…', 'ok');
          await loadPlan();
          setStatus('');
          showToast('Plan up to date', 'ok');
        } else {
          setStatus('');
          showToast(`Run finished with "${latest.conclusion}" — check the Actions tab.`, 'err');
        }
        return;
      }
      await sleep(3000);
    }

    setBusy(false);
    setStatus('');
    showToast('Still running on GitHub — check back shortly.', '');
  }

  refreshBtn.addEventListener('click', runRefresh);

  loadPlan();
  calc();
</script>

</body>
