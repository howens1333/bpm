<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Plan Tools</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1e;
    --card: #202022;
    --card-hover: #2a2a2c;
    --text: #f2f2f2;
    --muted: #a0a0a3;
    --accent: #1ed760;
    --accent-dim: rgba(30, 215, 96, 0.15);
    --border: #2e2e30;
    --warn: #d98a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .col { border-right: none !important; border-bottom: 1px solid var(--border); }
    .col-left { position: static !important; max-height: none !important; }
  }
  .col {
    padding: 28px 22px 60px;
  }
  .col-left {
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px 0;
    font-weight: 600;
  }
  .plan-meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
    min-height: 16px;
  }

  /* --- Song cards (left) --- */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .song-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .song-card:hover { background: var(--card-hover); }
  .song-card.active { border-color: var(--accent); background: var(--card-hover); }
  .art {
    width: 52px;
    height: 52px;
    border-radius: 6px;
    background: linear-gradient(135deg, #3a3a3c, #232325);
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
  }
  .song-info { flex: 1; min-width: 0; }
  .song-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-sub {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .song-sub .no-bpm { color: var(--warn); }
  .song-ms { text-align: right; flex-shrink: 0; padding-left: 10px; }
  .song-ms .val {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .song-ms .unit {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* --- Manual calculator (left) --- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px 0;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 26px;
    font-family: inherit;
    padding: 14px 16px;
    text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 20px; }
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
  }
  .notes-grid button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 14px 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .notes-grid button:hover { border-color: var(--accent); }
  .notes-grid button.active {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 700;
  }
  .result {
    text-align: center;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .result .value { font-size: 40px; color: var(--accent); font-weight: 700; }
  .result .unit { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* --- Plan items / notes (right) --- */
  .items {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  /* Header rows — full-width section dividers, like PCO's gray bars */
  .row-header-bar {
    padding: 12px 18px;
    background: #232326;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row-header-bar:hover { color: var(--text); }

  /* Regular rows — songs and plain items, table-like */
  .item-row {
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .row-main {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .row-main:hover { background: var(--card-hover); }
  .item-row.is-song .row-main { border-left-color: var(--accent); }

  .row-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  .row-text { flex: 1; min-width: 0; }
  .row-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-row.is-song .row-title { color: var(--accent); }
  .row-sub {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .row-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .row-tag {
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 20px;
  }
  .row-chevron {
    color: var(--muted);
    font-size: 12px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .item-row.open .row-chevron,
  .row-header-bar.open .row-chevron { transform: rotate(90deg); }

  .row-options {
    display: none;
    padding: 4px 18px 16px;
    background: var(--bg);
  }
  .item-row.open .row-options { display: block; }
  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .option-chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
  }
  .option-chip:active { transform: scale(0.97); }
  .option-chip.selected {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
  }
  .empty-state { font-size: 13px; color: var(--muted); padding: 16px 18px; }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT: BPM tool -->
  <div class="col col-left">
    <h1>BPM → ms</h1>
    <div class="plan-meta" id="planMeta">loading plan…</div>

    <div class="cards" id="cards"></div>

    <div class="panel">
      <h2>Manual</h2>
      <div class="field">
        <label for="bpm">Tempo (BPM)</label>
        <input type="number" id="bpm" value="120" min="1">
      </div>

      <div class="notes-grid" id="notesGrid">
        <button data-n="16">1/16</button>
        <button data-n="8">1/8</button>
        <button data-n="6">1/6</button>
        <button data-n="4" class="active">1/4</button>
        <button data-n="2">1/2</button>
        <button data-n="1">1</button>
      </div>

      <div class="result">
        <div class="value" id="ms">500</div>
        <div class="unit">milliseconds</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Plan items / assignment notes -->
  <div class="col col-right">
    <h1>Plan Notes</h1>
    <div class="plan-meta" id="itemsMeta">loading plan…</div>
    <div class="items" id="items"></div>
  </div>

</div>

<script>
  // ---------- Shared state ----------
  const OPTIONS = ['HH1', 'HH2', 'HH3', 'HH4', 'WL', 'Mac', 'LAV 1', 'LAV 2', 'LAV 3', 'Meredith', 'Billy'];
  let n = 4;
  let songs = [];
  let items = [];
  let planId = null;

  // ---------- BPM calculator (left) ----------
  const bpmInput = document.getElementById('bpm');
  const notesGrid = document.getElementById('notesGrid');
  const msEl = document.getElementById('ms');
  const cardsEl = document.getElementById('cards');
  const planMeta = document.getElementById('planMeta');

  function msFor(bpm, noteN) {
    if (!bpm || bpm <= 0) return null;
    return (60000 / bpm) * (4 / noteN);
  }
  function fmt(ms) {
    if (ms === null) return '—';
    return ms % 1 === 0 ? ms.toString() : ms.toFixed(1);
  }
  function calc() {
    const bpm = parseFloat(bpmInput.value) || 0;
    msEl.textContent = fmt(msFor(bpm, n));
  }
  function renderCards() {
    if (!songs.length) { cardsEl.innerHTML = ''; return; }
    cardsEl.innerHTML = songs.map((s, i) => `
      <div class="song-card" data-i="${i}">
        ${s.art ? `<img class="art" src="${s.art}" alt="">` : `<div class="art">🎵</div>`}
        <div class="song-info">
          <div class="song-title">${s.title}</div>
          <div class="song-sub">${s.artist ? s.artist + ' · ' : ''}${s.bpm ? s.bpm + ' BPM' : '<span class="no-bpm">no BPM set</span>'}</div>
        </div>
        <div class="song-ms">
          <div class="val">${fmt(msFor(s.bpm, n))}</div>
          <div class="unit">ms</div>
        </div>
      </div>
    `).join('');
  }

  bpmInput.addEventListener('input', calc);

  notesGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    notesGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    n = parseFloat(btn.dataset.n);
    calc();
    renderCards();
  });

  cardsEl.addEventListener('click', (e) => {
    const cardEl = e.target.closest('.song-card');
    if (!cardEl) return;
    cardsEl.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
    cardEl.classList.add('active');
    const song = songs[cardEl.dataset.i];
    if (song.bpm) { bpmInput.value = song.bpm; calc(); }
  });

  async function enrichSong(song) {
    try {
      const q = encodeURIComponent(song.title);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
      const data = await res.json();
      const hit = data.results && data.results[0];
      if (hit) {
        song.artist = hit.artistName;
        song.art = hit.artworkUrl100 ? hit.artworkUrl100.replace('100x100bb', '300x300bb') : null;
      }
    } catch (err) { /* not on iTunes, skip */ }
  }

  // ---------- Plan item notes (right) ----------
  const itemsEl = document.getElementById('items');
  const itemsMeta = document.getElementById('itemsMeta');

  function storageKey(itemId) {
    return `pco-notes:${planId}:${itemId}`;
  }
  function getTags(itemId) {
    try {
      const raw = localStorage.getItem(storageKey(itemId));
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function setTags(itemId, tags) {
    localStorage.setItem(storageKey(itemId), JSON.stringify(tags));
  }

  // A small rotating palette for song initial badges (PCO-style colored circles)
  const BADGE_COLORS = ['#3b6fd1', '#5aa66b', '#c4823a', '#a15dc9', '#3ba3a3', '#c15a7a'];
  function badgeColor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return BADGE_COLORS[hash % BADGE_COLORS.length];
  }

  function renderItems() {
    if (!items.length) {
      itemsEl.innerHTML = '<div class="empty-state">no plan items yet</div>';
      return;
    }
    itemsEl.innerHTML = items.map((it, idx) => {
      // Fallback to a positional id if the synced data is missing a real
      // one, so items never accidentally share a storage key.
      const itemId = (it.id !== undefined && it.id !== null && it.id !== '')
        ? String(it.id)
        : `idx-${idx}`;
      const tags = getTags(itemId);
      const isHeader = it.type === 'header';
      const isSong = it.type === 'song';

      const optionsHtml = `
        <div class="row-options">
          <div class="option-grid">
            ${OPTIONS.map(opt => `
              <button class="option-chip ${tags.includes(opt) ? 'selected' : ''}" data-opt="${opt}">${opt}</button>
            `).join('')}
          </div>
        </div>
      `;

      if (isHeader) {
        return `
          <div class="item-row" data-id="${itemId}" data-kind="header">
            <div class="row-header-bar">
              <span>${it.title}</span>
              <span class="row-chevron">▶</span>
            </div>
            ${optionsHtml}
          </div>
        `;
      }

      const sub = isSong
        ? `${it.artist ? it.artist + ' · ' : ''}${it.bpm ? it.bpm + ' BPM' : 'no BPM set'}`
        : '';
      const badge = isSong
        ? `<div class="row-badge" style="background:${badgeColor(it.title || '')}">${(it.title || '?').trim().charAt(0).toUpperCase()}</div>`
        : '';

      return `
        <div class="item-row ${isSong ? 'is-song' : ''}" data-id="${itemId}">
          <div class="row-main">
            ${badge}
            <div class="row-text">
              <div class="row-title">${it.title}</div>
              ${sub ? `<div class="row-sub">${sub}</div>` : ''}
              <div class="row-tags">${tags.map(t => `<span class="row-tag">${t}</span>`).join('')}</div>
            </div>
            <div class="row-chevron">▶</div>
          </div>
          ${optionsHtml}
        </div>
      `;
    }).join('');
  }

  itemsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.option-chip');
    const rowEl = e.target.closest('.item-row');
    if (!rowEl) return;
    const itemId = rowEl.dataset.id;

    if (chip) {
      e.stopPropagation();
      const opt = chip.dataset.opt;
      const tags = getTags(itemId);
      const idx = tags.indexOf(opt);
      if (idx >= 0) tags.splice(idx, 1); else tags.push(opt);
      setTags(itemId, tags);
      renderItems();
      const reopened = itemsEl.querySelector(`.item-row[data-id="${CSS.escape(itemId)}"]`);
      if (reopened) reopened.classList.add('open');
      return;
    }

    const toggleTarget = e.target.closest('.row-main') || e.target.closest('.row-header-bar');
    if (toggleTarget) {
      rowEl.classList.toggle('open');
    }
  });

  // ---------- Load synced plan data ----------
  async function loadPlan() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data.json yet');
      const data = await res.json();

      planId = data.planId || 'no-plan';
      const label = data.planTitle
        ? `${data.planTitle} · synced ${new Date(data.updated).toLocaleDateString()}`
        : 'no upcoming plan found';
      planMeta.textContent = label;
      itemsMeta.textContent = label;

      songs = data.songs || [];
      items = data.items || data.songs || [];

      renderCards();
      renderItems();

      await Promise.all(songs.map(async (s) => { await enrichSong(s); renderCards(); }));
    } catch (err) {
      planMeta.textContent = 'no synced plan yet — enter BPM manually below';
      itemsMeta.textContent = 'no synced plan yet';
      planId = 'no-plan';
    }
  }

  loadPlan();
  calc();
</script>

</body>
</html>
