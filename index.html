<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPM → ms</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #262628;
    --text: #e8e6e1;
    --muted: #8a8a8d;
    --accent: #5ec8b8;
    --border: #38383a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Courier New', ui-monospace, monospace;
    color: var(--text);
  }
  .card {
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px 0;
    text-align: center;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 22px;
    font-family: inherit;
    padding: 10px 12px;
    text-align: center;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0;
  }
  .notes button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .notes button:hover {
    border-color: var(--accent);
  }
  .notes button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .result {
    text-align: center;
    margin-top: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .result .value {
    font-size: 36px;
    color: var(--accent);
    font-weight: bold;
  }
  .result .unit {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>BPM to ms</h1>

  <label for="bpm">Tempo (BPM)</label>
  <input type="number" id="bpm" value="120" min="1">

  <div class="notes" id="notes">
    <button data-n="16">1/16</button>
    <button data-n="8">1/8</button>
    <button data-n="6">1/6</button>
    <button data-n="4" class="active">1/4</button>
    <button data-n="2">1/2</button>
    <button data-n="1">1</button>
  </div>

  <div class="result">
    <div class="value" id="ms">500</div>
    <div class="unit">milliseconds</div>
  </div>
</div>

<script>
  const bpmInput = document.getElementById('bpm');
  const notesEl = document.getElementById('notes');
  const msEl = document.getElementById('ms');
  let n = 4;

  function calc() {
    const bpm = parseFloat(bpmInput.value) || 0;
    if (bpm <= 0) {
      msEl.textContent = '—';
      return;
    }
    // ms per quarter note = 60000 / bpm
    // ms per 1/N note = (60000 / bpm) * (4 / N)
    const ms = (60000 / bpm) * (4 / n);
    msEl.textContent = ms % 1 === 0 ? ms.toString() : ms.toFixed(1);
  }

  bpmInput.addEventListener('input', calc);

  notesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    notesEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    n = parseFloat(btn.dataset.n);
    calc();
  });

  calc();
</script>

</body>
</html>
