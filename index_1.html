<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPM → ms</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1e;
    --card: #202022;
    --card-hover: #2a2a2c;
    --text: #f2f2f2;
    --muted: #a0a0a3;
    --accent: #1ed760;
    --border: #2e2e30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 32px 20px 60px;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px 0;
    font-weight: 600;
  }
  .plan-meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
    min-height: 16px;
  }

  /* --- Song cards --- */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 36px;
  }
  .song-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .song-card:hover {
    background: var(--card-hover);
  }
  .song-card.active {
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .art {
    width: 52px;
    height: 52px;
    border-radius: 6px;
    background: #333 linear-gradient(135deg, #3a3a3c, #232325);
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
  }
  .song-info {
    flex: 1;
    min-width: 0;
  }
  .song-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-sub {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .song-sub .no-bpm {
    color: #d98a5f;
  }
  .song-ms {
    text-align: right;
    flex-shrink: 0;
    padding-left: 10px;
  }
  .song-ms .val {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .song-ms .unit {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* --- Manual calculator --- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
  }
  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px 0;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 28px;
    font-family: inherit;
    padding: 14px 16px;
    text-align: center;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field {
    margin-bottom: 20px;
  }
  .notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
  }
  .notes button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 14px 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .notes button:hover {
    border-color: var(--accent);
  }
  .notes button.active {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 700;
  }
  .result {
    text-align: center;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .result .value {
    font-size: 44px;
    color: var(--accent);
    font-weight: 700;
  }
  .result .unit {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="page">
  <h1>BPM → ms</h1>
  <div class="plan-meta" id="planMeta">loading plan…</div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Manual</h2>
    <div class="field">
      <label for="bpm">Tempo (BPM)</label>
      <input type="number" id="bpm" value="120" min="1">
    </div>

    <div class="notes" id="notes">
      <button data-n="16">1/16</button>
      <button data-n="8">1/8</button>
      <button data-n="6">1/6</button>
      <button data-n="4" class="active">1/4</button>
      <button data-n="2">1/2</button>
      <button data-n="1">1</button>
    </div>

    <div class="result">
      <div class="value" id="ms">500</div>
      <div class="unit">milliseconds</div>
    </div>
  </div>
</div>

<script>
  const bpmInput = document.getElementById('bpm');
  const notesEl = document.getElementById('notes');
  const msEl = document.getElementById('ms');
  const cardsEl = document.getElementById('cards');
  const planMeta = document.getElementById('planMeta');
  let n = 4;
  let songs = [];

  function msFor(bpm, noteN) {
    if (!bpm || bpm <= 0) return null;
    return (60000 / bpm) * (4 / noteN);
  }

  function fmt(ms) {
    if (ms === null) return '—';
    return ms % 1 === 0 ? ms.toString() : ms.toFixed(1);
  }

  function calc() {
    const bpm = parseFloat(bpmInput.value) || 0;
    msEl.textContent = fmt(msFor(bpm, n));
  }

  function renderCards() {
    if (!songs.length) {
      cardsEl.innerHTML = '';
      return;
    }
    cardsEl.innerHTML = songs.map((s, i) => `
      <div class="song-card" data-i="${i}">
        ${s.art
          ? `<img class="art" src="${s.art}" alt="">`
          : `<div class="art">🎵</div>`}
        <div class="song-info">
          <div class="song-title">${s.title}</div>
          <div class="song-sub">${s.artist ? s.artist + ' · ' : ''}${s.bpm ? s.bpm + ' BPM' : '<span class="no-bpm">no BPM set</span>'}</div>
        </div>
        <div class="song-ms">
          <div class="val">${fmt(msFor(s.bpm, n))}</div>
          <div class="unit">ms</div>
        </div>
      </div>
    `).join('');
  }

  bpmInput.addEventListener('input', calc);

  notesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    notesEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    n = parseFloat(btn.dataset.n);
    calc();
    renderCards();
  });

  cardsEl.addEventListener('click', (e) => {
    const cardEl = e.target.closest('.song-card');
    if (!cardEl) return;
    cardsEl.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
    cardEl.classList.add('active');
    const song = songs[cardEl.dataset.i];
    if (song.bpm) {
      bpmInput.value = song.bpm;
      calc();
    }
  });

  // --- Look up artist + album art via the free iTunes Search API ---
  async function enrichSong(song) {
    try {
      const q = encodeURIComponent(song.title);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
      const data = await res.json();
      const hit = data.results && data.results[0];
      if (hit) {
        song.artist = hit.artistName;
        song.art = hit.artworkUrl100 ? hit.artworkUrl100.replace('100x100bb', '300x300bb') : null;
      }
    } catch (err) {
      // silently skip — original worship songs often aren't on iTunes
    }
  }

  // --- Planning Center sync ---
  async function loadPlan() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data.json yet');
      const data = await res.json();

      if (!data.songs || data.songs.length === 0) {
        planMeta.textContent = data.planTitle
          ? `${data.planTitle} — no songs found`
          : 'no upcoming plan found — enter BPM manually below';
        return;
      }

      planMeta.textContent = `${data.planTitle || 'Next plan'} · synced ${new Date(data.updated).toLocaleDateString()}`;
      songs = data.songs;
      renderCards();

      // Fetch art/artist in the background, render as each resolves
      await Promise.all(songs.map(async (s) => {
        await enrichSong(s);
        renderCards();
      }));
    } catch (err) {
      planMeta.textContent = 'no synced plan yet — enter BPM manually below';
    }
  }

  loadPlan();
  calc();
</script>

</body>
</html>
